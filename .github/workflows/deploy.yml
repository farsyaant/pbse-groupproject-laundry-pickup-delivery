name: Deploy to Portainer (kevinio)

on:
  workflow_run:
    workflows: ["Build and publish container"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Portainer stack redeploy
        run: |
          curl -fsS -X PUT \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"RepullImageAndRedeploy": true}' \
            "https://portainer.kevinio.my.id/api/stacks/${{ secrets.PORTAINER_STACK_ID }}/git/redeploy?endpointId=3"
