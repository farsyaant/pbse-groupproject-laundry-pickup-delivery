name: Contract Test CI

on:
  push:
    branches: [ main, integration-owner ]
  pull_request:
    branches: [ main ]

jobs:
  contract-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install service dependencies
        run: |
          cd service
          pnpm install

      - name: Start Prism contract mock
        run: |
          pnpm --package=@stoplight/prism-cli dlx prism mock openapi.yaml -p 4010 > prism-ci.log 2>&1 &
          pnpm --package=wait-on dlx wait-on http://127.0.0.1:4010 --timeout 30000

      - name: Run Contract Tests against Prism
        run: |
          BASE_URL="http://127.0.0.1:4010" node tests/contract/test-contract.js

      - name: Run Authorization Tests
        run: |
          pnpm --dir service run test:authz

      - name: Run Redocly OpenAPI Lint
        run: |
          pnpm --package=@redocly/cli dlx redocly lint openapi.yaml
