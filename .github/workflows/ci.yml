name: Contract Test CI

on:
  push:
    branches: [ main, integration-owner ]
  pull_request:
    branches: [ main ]

jobs:
  contract-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install service dependencies
        run: |
          cd service
          pnpm install

      # Prism answers HEAD / and HEAD /health with 404 / 405, so a plain
      # `wait-on http://host:port` probe (which sends HEAD) never turns green.
      # Probe with an explicit GET on the health path instead.
      - name: Start Prism contract mock
        run: |
          set -euo pipefail
          nohup pnpm --package=@stoplight/prism-cli dlx prism mock openapi.yaml -p 4010 > prism-ci.log 2>&1 &
          PRISM_PID=$!
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:4010/health > /dev/null; then
              echo "Prism ready after ${attempt} attempt(s)"
              exit 0
            fi
            if ! kill -0 "$PRISM_PID" 2>/dev/null; then
              echo "::error::Prism process exited before becoming ready"
              cat prism-ci.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Prism did not become ready in 40s"
          cat prism-ci.log
          exit 1

      - name: Run Contract Tests against Prism
        run: |
          BASE_URL="http://127.0.0.1:4010" node tests/contract/test-contract.js

      - name: Run Authorization Tests
        run: |
          pnpm --dir service run test:authz

      - name: Run Redocly OpenAPI Lint
        run: |
          pnpm --package=@redocly/cli dlx redocly lint openapi.yaml

      - name: Show Prism log on failure
        if: failure()
        run: cat prism-ci.log || true