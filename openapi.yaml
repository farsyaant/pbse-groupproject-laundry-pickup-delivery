openapi: 3.0.3
info:
  title: Laundry Pickup & Delivery API
  version: 0.1.0
  license:
    name: Academic project
  description: >-
    Contract-first API for submitting laundry orders and arranging pickup.
    Clients MUST ignore unknown response fields and MUST safely handle unknown
    enumeration values without crashing.
servers:
  - url: https://api.example.com/v1
    description: Production API
  - url: http://localhost:8080/v1
    description: Local service
security:
  - bearerAuth: []
tags:
  - name: Orders
    description: Laundry order lifecycle
  - name: Pickups
    description: Pickup arrangements for laundry orders

paths:
  /orders:
    get:
      tags: [Orders]
      summary: List laundry orders
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Order collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: ord_01HZX2Y5K7
                  customerId: cus_01HZX2Y1AB
                  serviceType: wash_fold
                  weightKg: 5.5
                  pickupAddress: Jl. Merdeka No. 10, Jakarta
                  status: pending_pickup
                  createdAt: '2026-09-02T10:00:00Z'
                  updatedAt: '2026-09-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [Orders]
      summary: Create a laundry order
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: cus_01HZX2Y1AB
              serviceType: wash_fold
              weightKg: 5.5
              pickupAddress: Jl. Merdeka No. 10, Jakarta
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ord_01HZX2Y5K7
                customerId: cus_01HZX2Y1AB
                serviceType: wash_fold
                weightKg: 5.5
                pickupAddress: Jl. Merdeka No. 10, Jakarta
                status: pending_pickup
                createdAt: '2026-09-02T10:00:00Z'
                updatedAt: '2026-09-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get one laundry order
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Laundry order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ord_01HZX2Y5K7
                customerId: cus_01HZX2Y1AB
                serviceType: wash_fold
                weightKg: 5.5
                pickupAddress: Jl. Merdeka No. 10, Jakarta
                status: pending_pickup
                createdAt: '2026-09-02T10:00:00Z'
                updatedAt: '2026-09-02T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /orders/{orderId}/cancellation:
    post:
      tags: [Orders]
      summary: Cancel a laundry order
      operationId: cancelOrder
      description: >-
        Cancels an order only while its current state allows cancellation. The
        service is authoritative; clients must handle 409 if state changed.
        Cancellation is permitted only for pending_pickup, ready_for_pickup,
        and confirmed orders. Idempotency-Key is generated when the user
        confirms the operation, retained for 24 hours, and reused unchanged
        for retries. Reusing it with a different request returns 409. A
        matching request still being processed returns 409 with Retry-After.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
              example:
                id: can_01HZX30D2Q
                orderId: ord_01HZX2Y5K7
                reason: Customer requested cancellation
                status: completed
                createdAt: '2026-09-02T10:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /pickups:
    get:
      tags: [Pickups]
      summary: List pickup arrangements
      operationId: listPickups
      parameters:
        - $ref: '#/components/parameters/PickupStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pickup collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pickup'
              example:
                - id: pku_01HZX2Z8K9
                  orderId: ord_01HZX2Y5K7
                  driverId: drv_01HZX2Z1AA
                  scheduledAt: '2026-09-03T09:00:00Z'
                  address: Jl. Merdeka No. 10, Jakarta
                  status: scheduled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Opaque server-generated order identifier
      schema:
        type: string
        pattern: '^ord_[A-Za-z0-9]+$'
        example: ord_01HZX2Y5K7
    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: Return orders with this status
      schema:
        type: string
        enum: [pending_pickup, ready_for_pickup, confirmed, assigned, picked_up, processing, completed, cancelled]
        example: ready_for_pickup
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of resources returned in the collection.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor for retrieving the next collection page.
      schema:
        type: string
        example: cur_01HZX31ABC
    PickupStatusFilter:
      name: status
      in: query
      required: false
      description: Return pickups with this status
      schema:
        type: string
        enum: [scheduled, assigned, picked_up, delivered, cancelled]
        example: scheduled
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Canonical UUID v4 generated when the user confirms the operation and
        persisted with the pending request. The same key must be reused for
        every retry of that request and is retained for 24 hours. A new key
        after retention is treated as a new request. The same key with the
        same request returns the original result; the same key with different
        request data returns 409 Conflict.
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000

  schemas:
    Order:
      type: object
      required: [id, customerId, serviceType, weightKg, pickupAddress, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: ord_01HZX2Y5K7
        customerId:
          type: string
          example: cus_01HZX2Y1AB
        serviceType:
          type: string
          enum: [wash_fold, dry_clean, iron_only]
          example: wash_fold
        weightKg:
          type: number
          format: float
          minimum: 0.1
          example: 5.5
        pickupAddress:
          type: string
          example: Jl. Merdeka No. 10, Jakarta
        status:
          type: string
          enum: [pending_pickup, ready_for_pickup, confirmed, assigned, picked_up, processing, completed, cancelled]
          description: Clients MUST safely handle unknown values as an in-progress state.
          example: pending_pickup
        createdAt:
          type: string
          format: date-time
          example: '2026-09-02T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-02T10:00:00Z'
    CreateOrderRequest:
      type: object
      required: [customerId, serviceType, weightKg, pickupAddress]
      properties:
        customerId:
          type: string
          example: cus_01HZX2Y1AB
        serviceType:
          type: string
          enum: [wash_fold, dry_clean, iron_only]
          example: wash_fold
        weightKg:
          type: number
          format: float
          minimum: 0.1
          example: 5.5
        pickupAddress:
          type: string
          example: Jl. Merdeka No. 10, Jakarta
    Pickup:
      type: object
      required: [id, orderId, driverId, scheduledAt, address, status]
      properties:
        id:
          type: string
          example: pku_01HZX2Z8K9
        orderId:
          type: string
          example: ord_01HZX2Y5K7
        driverId:
          type: string
          example: drv_01HZX2Z1AA
        scheduledAt:
          type: string
          format: date-time
          example: '2026-09-03T09:00:00Z'
        address:
          type: string
          example: Jl. Merdeka No. 10, Jakarta
        status:
          type: string
          enum: [scheduled, assigned, picked_up, delivered, cancelled]
          example: scheduled
    Cancellation:
      type: object
      required: [id, orderId, reason, status, createdAt]
      properties:
        id:
          type: string
          example: can_01HZX30D2Q
        orderId:
          type: string
          example: ord_01HZX2Y5K7
        reason:
          type: string
          example: Customer requested cancellation
        status:
          type: string
          enum: [completed]
          example: completed
        createdAt:
          type: string
          format: date-time
          example: '2026-09-02T10:05:00Z'
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://api.example.com/problems/order-not-cancellable
        title:
          type: string
          example: Order cannot be cancelled
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: Order has already entered processing.
        instance:
          type: string
          example: /v1/orders/ord_01HZX2Y5K7/cancellation
        currentStatus:
          type: string
          example: assigned
        allowedStatuses:
          type: array
          items:
            type: string
          example: [pending_pickup, ready_for_pickup, confirmed]

  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/bad-request
            title: Bad request
            status: 400
            detail: Request is malformed or contains invalid syntax.
            instance: /v1/orders
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication is required.
            instance: /v1/orders
    Forbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/forbidden
            title: Forbidden
            status: 403
            detail: Actor is not allowed to perform this operation.
            instance: /v1/orders/ord_01HZX2Y5K7/cancellation
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/not-found
            title: Resource not found
            status: 404
            detail: Requested resource does not exist.
            instance: /v1/orders/ord_unknown
    Conflict:
      description: Request conflicts with current domain state or idempotency record
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidState:
              value:
                type: https://api.example.com/problems/order-not-cancellable
                title: Order cannot be cancelled
                status: 409
                detail: Order has already entered processing.
                instance: /v1/orders/ord_01HZX2Y5K7/cancellation
            idempotencyConflict:
              value:
                type: https://api.example.com/problems/idempotency-conflict
                title: Idempotency key conflict
                status: 409
                detail: Idempotency-Key was reused with different request data.
                instance: /v1/orders
      headers:
        Retry-After:
          description: Seconds to wait when the request for this key is still processing.
          schema:
            type: integer
            minimum: 1
            example: 5
    UnprocessableContent:
      description: Request data or domain validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/validation-failed
            title: Validation failed
            status: 422
            detail: One or more request fields are invalid.
            instance: /v1/orders
    InternalServerError:
      description: Unexpected internal error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/internal-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred.
            instance: /v1/orders
    BadGateway:
      description: Upstream dependency failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/bad-gateway
            title: Bad gateway
            status: 502
            detail: An upstream dependency returned an invalid response.
            instance: /v1/orders
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/service-unavailable
            title: Service unavailable
            status: 503
            detail: Service is temporarily unavailable.
            instance: /v1/orders
    GatewayTimeout:
      description: Gateway or upstream timeout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/gateway-timeout
            title: Gateway timeout
            status: 504
            detail: Upstream service did not respond in time.
            instance: /v1/orders
