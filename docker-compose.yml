services:
  app:
    image: ghcr.io/farsyaant/pbse-groupproject-laundry-pickup-delivery:latest
    container_name: laundry-service
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_FILE: ./db/laundry.sqlite
      NODE_ENV: production
    volumes:
      - laundry_data:/app/service/db
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  laundry_data:
