services:
  app:
    image: ghcr.io/farsyaant/pbse-groupproject-laundry-pickup-delivery:latest
    pull_policy: always
    container_name: laundry-service
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_FILE: ./db/laundry.sqlite
      NODE_ENV: production
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
    volumes:
      - laundry_data:/app/service/db
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laundry.rule=Host(`pbse.kevinio.my.id`)"
      - "traefik.http.routers.laundry.entrypoints=web"
      - "traefik.http.services.laundry.loadbalancer.server.port=8080"

volumes:
  laundry_data:

networks:
  proxy:
    external: true
